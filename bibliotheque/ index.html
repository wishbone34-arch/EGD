<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0612;
    color: #e8ddf5;
    font-family: -apple-system, system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 18px 16px 10px;
    background: linear-gradient(180deg, #241a38 0%, #0a0612 100%);
  }
  h1 {
    font-size: 1.3rem;
    background: linear-gradient(90deg, #d4a5ff, #ffe9c7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 10px;
  }
  #searchInput {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.08); color: #e8ddf5; font-size: 0.95rem;
  }
  #searchInput::placeholder { color: #8a7aa8; }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
    background: rgba(124,77,255,0.1); border: 1px solid rgba(212,165,255,0.25);
    color: #b3a2d1; font-size: 0.82rem; white-space: nowrap; cursor: pointer;
  }
  .tab.active { background: #7c4dff; color: #16101f; font-weight: 700; border-color: #7c4dff; }
  main { flex: 1; overflow-y: auto; padding: 8px 16px 130px; }
  .track {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 10px; border-radius: 12px; margin-bottom: 6px;
    background: rgba(124,77,255,0.05);
  }
  .track.playing { background: rgba(124,77,255,0.22); }
  .track-icon {
    font-size: 1.3rem; width: 34px; text-align: center; flex-shrink: 0;
    background: linear-gradient(135deg, #d4a5ff, #ffe9c7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 700;
  }
  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-meta { font-size: 0.75rem; color: #8a7aa8; margin-top: 2px; }
  .track-action {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); border: none; color: #e8ddf5; font-size: 1.1rem;
  }
  .track-action.ready { background: #7c4dff; }
  .track-action.busy { background: rgba(212,165,255,0.2); font-size: 0.7rem; }
  .empty-msg { text-align: center; color: #7a6a96; padding: 40px 20px; font-size: 0.9rem; }

  #player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #151022; border-top: 1px solid rgba(212,165,255,0.2);
    padding: 10px 16px 18px; display: none;
  }
  #player.show { display: block; }
  .player-track { font-size: 0.88rem; font-weight: 700; margin-bottom: 2px; }
  .player-sub { font-size: 0.72rem; color: #8a7aa8; margin-bottom: 10px; }
  .player-controls {
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .player-btn { background: none; border: none; color: #e8ddf5; font-size: 1.3rem; }
  .player-btn.main {
    width: 48px; height: 48px; border-radius: 50%; background: #7c4dff;
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
  }
  .player-btn.toggled { color: #d4a5ff; }
  .genrow {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
  }
  .genrow input[type=range] { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>Fréquences Sacrées</h1>
  <input type="text" id="searchInput" placeholder="Rechercher un morceau...">
  <div class="tabs" id="tabs"></div>
</header>

<main id="trackList"></main>

<div id="player">
  <div class="player-track" id="playerTrackName">—</div>
  <div class="player-sub" id="playerTrackMeta">—</div>
  <div class="player-controls">
    <button class="player-btn" id="shuffleBtn" title="Lecture aléatoire">🔀</button>
    <button class="player-btn" id="prevBtn">⏮</button>
    <button class="player-btn main" id="playPauseBtn">▶</button>
    <button class="player-btn" id="nextBtn">⏭</button>
    <button class="player-btn" id="loopBtn" title="Répéter">🔁</button>
  </div>
</div>

// ===== IndexedDB : stockage persistant des MP3 générés =====
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('frequences-sacrees-db', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('tracks');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function saveTrackBlob(id, blob) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('tracks', 'readwrite');
    tx.objectStore('tracks').put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getTrackBlob(id) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('tracks', 'readonly');
    const req = tx.objectStore('tracks').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function loadExistingLibrary() {
  for (const p of PRESETS) {
    const blob = await getTrackBlob(p.id);
    if (blob) library[p.id] = { status: 'ready', blobUrl: URL.createObjectURL(blob) };
  }
  renderTracks();
}

// ===== UI : onglets catégories =====
function renderTabs() {
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'tab' + (cat === activeCategory ? ' active' : '');
    el.textContent = cat;
    el.onclick = () => { activeCategory = cat; renderTabs(); renderTracks(); };
    tabsEl.appendChild(el);
  });
}
renderTabs();

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  renderTracks();
});

// ===== UI : liste des morceaux =====
function getFilteredSortedPresets() {
  return PRESETS
    .filter(p => activeCategory === 'Tout' || p.category === activeCategory)
    .filter(p => p.name.toLowerCase().includes(searchQuery))
    .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
}

function renderTracks() {
  const list = getFilteredSortedPresets();
  trackListEl.innerHTML = '';
  if (list.length === 0) {
    trackListEl.innerHTML = '<div class="empty-msg">Aucun morceau trouvé.</div>';
    return;
  }
  list.forEach(p => {
    const state = library[p.id] || { status: 'none' };
    const row = document.createElement('div');
    row.className = 'track' + (currentTrackId === p.id ? ' playing' : '');
    row.innerHTML = `
      <div class="track-icon">${p.icon}</div>
      <div class="track-info">
        <div class="track-name">${p.name}</div>
        <div class="track-meta">${p.category} · ${p.duration} min</div>
      </div>
      <button class="track-action ${state.status === 'ready' ? 'ready' : ''} ${state.status === 'loading' ? 'busy' : ''}" data-id="${p.id}">
        ${state.status === 'ready' ? '▶' : state.status === 'loading' ? '…' : '⬇️'}
      </button>
    `;
    trackListEl.appendChild(row);
  });

  trackListEl.querySelectorAll('.track-action').forEach(btn => {
    btn.addEventListener('click', () => onTrackActionClick(btn.dataset.id));
  });
}

async function onTrackActionClick(id) {
  const preset = PRESETS.find(p => p.id === id);
  const state = library[id] || { status: 'none' };
  if (state.status === 'ready') {
    playTrack(id);
    return;
  }
  if (state.status === 'loading') return;

  library[id] = { status: 'loading' };
  renderTracks();
  try {
    const audioBuffer = await renderOffline(preset.theme, preset.voices, preset.duration * 60);
    const blob = encodeMp3(audioBuffer);
    await saveTrackBlob(id, blob);
    library[id] = { status: 'ready', blobUrl: URL.createObjectURL(blob) };
    renderTracks();
  } catch (err) {
    console.error(err);
    library[id] = { status: 'none' };
    renderTracks();
    alert('Erreur pendant la génération : ' + err.message);
  }
}

// ===== Lecteur =====
function playTrack(id) {
  const preset = PRESETS.find(p => p.id === id);
  const state = library[id];
  if (!state || state.status !== 'ready') return;
  currentTrackId = id;
  audioEl.src = state.blobUrl;
  audioEl.loop = loopOn;
  audioEl.play();
  playPauseBtn.textContent = '⏸';
  playerTrackName.textContent = preset.name;
  playerTrackMeta.textContent = `${preset.category} · ${preset.duration} min`;
  playerEl.classList.add('show');
  renderTracks();
}

playPauseBtn.addEventListener('click', () => {
  if (!currentTrackId) return;
  if (audioEl.paused) { audioEl.play(); playPauseBtn.textContent = '⏸'; }
  else { audioEl.pause(); playPauseBtn.textContent = '▶'; }
});

function getReadyIds() {
  return getFilteredSortedPresets().map(p => p.id).filter(id => library[id] && library[id].status === 'ready');
}

function playRelative(offset) {
  const ready = getReadyIds();
  if (ready.length === 0) return;
  if (shuffleOn) {
    let next = pick(ready);
    if (ready.length > 1) while (next === currentTrackId) next = pick(ready);
    playTrack(next);
    return;
  }
  const idx = ready.indexOf(currentTrackId);
  const nextIdx = ((idx === -1 ? 0 : idx + offset) + ready.length) % ready.length;
  playTrack(ready[nextIdx]);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

prevBtn.addEventListener('click', () => playRelative(-1));
nextBtn.addEventListener('click', () => playRelative(1));
shuffleBtn.addEventListener('click', () => { shuffleOn = !shuffleOn; shuffleBtn.classList.toggle('toggled', shuffleOn); });
loopBtn.addEventListener('click', () => { loopOn = !loopOn; audioEl.loop = loopOn; loopBtn.classList.toggle('toggled', loopOn); });
audioEl.addEventListener('ended', () => { if (!loopOn) playRelative(1); });

// ===== Moteur de génération (identique au prototype MP3 précédent) =====
function randRange(min, max) { return min + Math.random() * (max - min); }
function createNoiseBuffer(ctx, seconds) {
  const bufferSize = Math.floor(ctx.sampleRate * seconds);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + 0.02 * white) / 1.02;
    data[i] = lastOut * 3.2;
  }
  return buffer;
}
function createReverbImpulse(ctx, duration, decay) {
  const rate = ctx.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
  }
  return impulse;
}
function buildScale(rootFreq) {
  const ratios = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2];
  return ratios.map(r => rootFreq * r);
}
function buildTimeline(voices, duration) {
  const events = [];
  if (voices.includes('bells')) {
    let t = randRange(0.5, 4);
    while (t < duration) { events.push({ type: 'bell', time: t }); t += randRange(9, 26); }
  }
  if (voices.includes('drum')) {
    let t = randRange(1, 5);
    while (t < duration) {
      events.push({ type: 'drum', time: t });
      if (Math.random() < 0.4) events.push({ type: 'shaker', time: t + randRange(0.15, 0.35) });
      t += randRange(3, 9);
    }
  }
  if (voices.includes('nature')) {
    let t = randRange(0.2, 1);
    while (t < duration) { events.push({ type: 'droplet', time: t }); t += randRange(0.12, 0.9); }
  }
  if (voices.includes('flute')) {
    let t = randRange(2, 8);
    while (t < duration) {
      const noteCount = Math.floor(randRange(2, 5));
      for (let i = 0; i < noteCount; i++) {
        const noteTime = t + i * randRange(1.4, 2.6);
        if (noteTime < duration) events.push({ type: 'flute', time: noteTime });
      }
      t += noteCount * 2 + randRange(15, 40);
    }
  }
  return events;
}

async function renderOffline(rootFreq, voices, duration) {
  const sampleRate = 44100;
  const ctx = new OfflineAudioContext(2, Math.floor(sampleRate * duration), sampleRate);
  const scale = buildScale(rootFreq);

  const masterGain = ctx.createGain(); masterGain.gain.value = 0;
  const shaper = ctx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = (i / 1023) * 2 - 1; curve[i] = Math.tanh(x * 1.3); }
  shaper.curve = curve;

  const convolver = ctx.createConvolver();
  convolver.buffer = createReverbImpulse(ctx, 3.5, 2.2);
  const reverbSend = ctx.createGain(); reverbSend.gain.value = 0.35;
  const dryGain = ctx.createGain(); dryGain.gain.value = 1;
  const mixBus = ctx.createGain();

  reverbSend.connect(convolver); convolver.connect(shaper); dryGain.connect(shaper);
  shaper.connect(masterGain); masterGain.connect(ctx.destination);

  masterGain.gain.setValueAtTime(0, 0);
  masterGain.gain.linearRampToValueAtTime(0.9, Math.min(3, duration * 0.3));
  masterGain.gain.setValueAtTime(0.9, Math.max(0, duration - 3));
  masterGain.gain.linearRampToValueAtTime(0, duration);

  const breathSpeed = 0.008 + Math.random() * 0.01;
  const breathLfo = ctx.createOscillator(); breathLfo.frequency.value = breathSpeed;
  const breathLfoGain = ctx.createGain(); breathLfoGain.gain.value = 0.12;
  breathLfo.connect(breathLfoGain); breathLfoGain.connect(masterGain.gain);
  breathLfo.start(0); breathLfo.stop(duration);

  if (voices.includes('drone')) {
    const bus = ctx.createGain(); bus.gain.value = 0.42; bus.connect(mixBus);
    const detune = 1 + (Math.random() * 0.008 - 0.004);
    const speeds = [0.015 + Math.random()*0.02, 0.02 + Math.random()*0.025, 0.008 + Math.random()*0.012];
    function layer(freq, baseGain, lfoSpeed, lfoDepth) {
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
      const gain = ctx.createGain(); gain.gain.value = baseGain;
      const lfo = ctx.createOscillator(); lfo.frequency.value = lfoSpeed;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = baseGain * lfoDepth;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      osc.connect(gain); gain.connect(bus);
      osc.start(0); osc.stop(duration); lfo.start(0); lfo.stop(duration);
    }
    layer(rootFreq, 0.5, speeds[0], 0.4);
    layer(rootFreq * detune, 0.35, speeds[1], 0.45);
    layer(rootFreq * 2, 0.15, speeds[2], 0.6);
  }

  if (voices.includes('nature')) {
    const windSource = ctx.createBufferSource();
    windSource.buffer = createNoiseBuffer(ctx, Math.min(duration, 6)); windSource.loop = true;
    const windFilter = ctx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 400; windFilter.Q.value = 0.6;
    const windGain = ctx.createGain(); windGain.gain.value = 0.07;
    windSource.connect(windFilter); windFilter.connect(windGain); windGain.connect(mixBus);
    const windLfo = ctx.createOscillator(); windLfo.frequency.value = 0.015 + Math.random() * 0.015;
    const windLfoGain = ctx.createGain(); windLfoGain.gain.value = 220;
    windLfo.connect(windLfoGain); windLfoGain.connect(windFilter.frequency);
    windSource.start(0); windSource.stop(duration); windLfo.start(0); windLfo.stop(duration);

    const oceanSource = ctx.createBufferSource();
    oceanSource.buffer = createNoiseBuffer(ctx, Math.min(duration, 8)); oceanSource.loop = true;
    const oceanFilter = ctx.createBiquadFilter(); oceanFilter.type = 'lowpass'; oceanFilter.frequency.value = 180;
    const oceanGain = ctx.createGain(); oceanGain.gain.value = 0.05;
    oceanSource.connect(oceanFilter); oceanFilter.connect(oceanGain); oceanGain.connect(mixBus);
    const oceanLfo = ctx.createOscillator(); oceanLfo.frequency.value = 0.05 + Math.random() * 0.04;
    const oceanLfoGain = ctx.createGain(); oceanLfoGain.gain.value = 0.045;
    oceanLfo.connect(oceanLfoGain); oceanLfoGain.connect(oceanGain.gain);
    oceanSource.start(0); oceanSource.stop(duration); oceanLfo.start(0); oceanLfo.stop(duration);

    const rainBed = ctx.createBufferSource();
    rainBed.buffer = createNoiseBuffer(ctx, Math.min(duration, 5)); rainBed.loop = true;
    const rainFilter = ctx.createBiquadFilter(); rainFilter.type = 'highpass'; rainFilter.frequency.value = 2500;
    const rainGain = ctx.createGain(); rainGain.gain.value = 0.025;
    rainBed.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(mixBus);
    rainBed.start(0); rainBed.stop(duration);

  timeline.forEach(ev => {
    if (ev.type === 'bell') {
      const freq = scale[Math.floor(Math.random()*scale.length)] * (Math.random() < 0.5 ? 1 : 2);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, ev.time);
      gain.gain.linearRampToValueAtTime(0.22, ev.time + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ev.time + randRange(4, 9));

        osc.start(ev.time); osc.stop(Math.min(duration, ev.time + 10));

    } else if (ev.type === 'drum') {
      const osc = ctx.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(120, ev.time);
      osc.frequency.exponentialRampToValueAtTime(55, ev.time + 0.25);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, ev.time);
      g.gain.linearRampToValueAtTime(0.28, ev.time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ev.time + 0.6);
      osc.connect(g); g.connect(mixBus);
      osc.start(ev.time); osc.stop(Math.min(duration, ev.time + 0.7));
    } else if (ev.type === 'shaker') {
      const noiseSrc = ctx.createBufferSource(); noiseSrc.buffer = createNoiseBuffer(ctx, 1);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.06, ev.time);
      g2.gain.exponentialRampToValueAtTime(0.0005, ev.time + 0.12);
      noiseSrc.connect(hp); hp.connect(g2); g2.connect(mixBus);
      noiseSrc.start(ev.time); noiseSrc.stop(Math.min(duration, ev.time + 0.15));
    } else if (ev.type === 'droplet') {
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = randRange(1200, 3200);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.015, ev.time);
      g.gain.exponentialRampToValueAtTime(0.0005, ev.time + 0.15);
      osc.connect(g); g.connect(mixBus);
      osc.start(ev.time); osc.stop(Math.min(duration, ev.time + 0.2));
    } else if (ev.type === 'flute') {
      const freq = scale[Math.floor(Math.random()*scale.length)];
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
      const vibrato = ctx.createOscillator(); vibrato.frequency.value = 4.5;
      const vibratoGain = ctx.createGain(); vibratoGain.gain.value = freq * 0.006;
      vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);
      const g = ctx.createGain(); const dur = randRange(1.2, 2.6);
      g.gain.setValueAtTime(0, ev.time);
      g.gain.linearRampToValueAtTime(0.16, ev.time + 0.25);
      g.gain.linearRampToValueAtTime(0, Math.min(duration, ev.time + dur));
      osc.connect(g); g.connect(mixBus);
      const stopTime = Math.min(duration, ev.time + dur + 0.1);
      osc.start(ev.time); osc.stop(stopTime); vibrato.start(ev.time); vibrato.stop(stopTime);
    }
  });

  return await ctx.startRendering();
}

function floatTo16BitPCM(input) {
  const output = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return output;
}
function encodeMp3(audioBuffer) {
  const sampleRate = audioBuffer.sampleRate;
  const left = floatTo16BitPCM(audioBuffer.getChannelData(0));
  const right = audioBuffer.numberOfChannels > 1 ? floatTo16BitPCM(audioBuffer.getChannelData(1)) : left;
  const mp3encoder = new lamejs.Mp3Encoder(2, sampleRate, 128);
  const blockSize = 1152;
  const mp3Data = [];
  for (let i = 0; i < left.length; i += blockSize) {
    const leftChunk = left.subarray(i, i + blockSize);
    const rightChunk = right.subarray(i, i + blockSize);
    const buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
    if (buf.length > 0) mp3Data.push(buf);
  }
  const endBuf = mp3encoder.flush();
  if (endBuf.length > 0) mp3Data.push(endBuf);
  return new Blob(mp3Data, { type: 'audio/mp3' });
}

// ===== Démarrage =====
renderTracks();
loadExistingLibrary();
