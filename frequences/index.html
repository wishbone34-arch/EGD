<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0612">
<link rel="icon" href="../icône-192.png">
<title>Fréquences Sacrées — Prototype v3</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #241a38 0%, #0a0612 70%);
    color: #e8ddf5;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 1.5rem;
    background: linear-gradient(90deg, #d4a5ff, #ffe9c7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    color: #a99bc4;
    font-size: 0.85rem;
    margin-bottom: 28px;
    text-align: center;
  }
  .section-label {
    width: 100%;
    max-width: 420px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a7aa8;
    margin: 18px 0 8px;
  }
  .theme-btn {
    width: 100%;
    max-width: 420px;
    padding: 16px;
    margin-bottom: 10px;
    border-radius: 14px;
    border: 1px solid rgba(212,165,255,0.3);
    background: rgba(124,77,255,0.08);
    color: #e8ddf5;
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
  }
  .theme-btn.selected {
    background: rgba(124,77,255,0.28);
    border-color: #d4a5ff;
    font-weight: 700;
  }
  .theme-freq {
    display: block;
    font-size: 0.75rem;
    color: #b3a2d1;
    margin-top: 2px;
  }
  .orb {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 8px auto 4px;
    background: radial-gradient(circle at 35% 30%, #ffe9c7, #d4a5ff 45%, #7c4dff 75%, transparent 100%);
    opacity: 0.25;
    transform: scale(1);
    transition: opacity 0.6s ease;
  }
  .orb.active { opacity: 0.9; }
  .voice-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    margin-bottom: 8px;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(124,77,255,0.06);
    border: 1px solid rgba(212,165,255,0.18);
  }
  .voice-row span { font-size: 0.88rem; }
  .switch { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.15); border-radius: 999px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 19px; width: 19px;
    left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background: #7c4dff; }
  input:checked + .slider::before { transform: translateX(19px); }
  #playBtn {
    width: 100%;
    max-width: 420px;
    margin-top: 22px;
    padding: 20px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(90deg, #7c4dff, #d4a5ff);
    color: #16101f;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
  #playBtn:active { transform: scale(0.98); }
  .status {
    margin-top: 16px;
    font-size: 0.82rem;
    color: #a99bc4;
    text-align: center;
    min-height: 20px;
  }
  .timer {
    font-size: 0.75rem;
    color: #7a6a96;
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>Fréquences Sacrées</h1>
<div class="subtitle">Prototype v3 — moteur de composition générative</div>

<div class="orb" id="orb"></div>

<div class="section-label">Fréquence de base</div>
<div id="themeList" style="width:100%;max-width:420px;"></div>

<div class="section-label">Voix (combinables)</div>
<div id="voiceList" style="width:100%;max-width:420px;"></div>

<button id="playBtn">▶ Lancer la composition</button>
<div class="status" id="status">Choisis une fréquence et des voix, puis lance.</div>
<div class="timer" id="timer"></div>

<script>
const THEMES = [
  { id: 'naturel432', label: '432 Hz — Accordage naturel', freq: 432 },
  { id: 'solfeggio528', label: '528 Hz — Solfeggio ("de l\'amour")', freq: 528 },
  { id: 'egd396', label: '396 Hz — Résonance d\'Entité EGD (exemple)', freq: 396 }
];

const VOICES = [
  { id: 'drone', label: '🌫️ Nappes éthérées (fond continu)', default: true },
  { id: 'bells', label: '🔔 Bols chantants / carillons', default: true },
  { id: 'nature', label: '🌧️ Nature (pluie, océan, vent)', default: false },
  { id: 'drum', label: '🥁 Percussions chamaniques douces', default: false },
  { id: 'flute', label: '🎋 Flûte méditative', default: false }
];

let selectedTheme = THEMES[0];
const voiceState = {};
VOICES.forEach(v => voiceState[v.id] = v.default);

let audioCtx = null;
let isPlaying = false;
let startTime = 0;
let timerInterval = null;
let orbAnimFrame = null;
let masterBreathSpeed = 0.02;

let activeNodes = [];
let scheduledTimeouts = [];
let masterGain = null;

const themeListEl = document.getElementById('themeList');
const voiceListEl = document.getElementById('voiceList');
const playBtn = document.getElementById('playBtn');
const statusEl = document.getElementById('status');
const orbEl = document.getElementById('orb');
const timerEl = document.getElementById('timer');

function renderThemes() {
  themeListEl.innerHTML = '';
  THEMES.forEach(theme => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (theme.id === selectedTheme.id ? ' selected' : '');
    btn.innerHTML = `${theme.label}<span class="theme-freq">${theme.freq} Hz</span>`;
    btn.onclick = () => {
      selectedTheme = theme;
      renderThemes();
      if (isPlaying) startEngine();
    };
    themeListEl.appendChild(btn);
  });
}
renderThemes();

function renderVoices() {
  voiceListEl.innerHTML = '';
  VOICES.forEach(v => {
    const row = document.createElement('div');
    row.className = 'voice-row';
    row.innerHTML = `
      <span>${v.label}</span>
      <label class="switch">
        <input type="checkbox" data-voice="${v.id}" ${voiceState[v.id] ? 'checked' : ''}>
        <span class="slider"></span>
      </label>`;
    voiceListEl.appendChild(row);
  });
  voiceListEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      voiceState[cb.dataset.voice] = cb.checked;
      if (isPlaying) startEngine();
    });
  });
}
renderVoices();

function createNoiseBuffer(ctx, seconds) {
  const bufferSize = ctx.sampleRate * seconds;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + 0.02 * white) / 1.02;
    data[i] = lastOut * 3.2;
  }
  return buffer;
}

function createReverbImpulse(ctx, duration, decay) {
  const rate = ctx.sampleRate;
  const length = rate * duration;
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

function buildScale(rootFreq) {
  const ratios = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2];
  return ratios.map(r => rootFreq * r);
}

function randRange(min, max) { return min + Math.random() * (max - min); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function scheduleTimeout(fn, delayMs) {
  const id = setTimeout(fn, delayMs);
  scheduledTimeouts.push(id);
  return id;
}

function startDroneVoice(ctx, destination, rootFreq) {
  const bus = ctx.createGain();
  bus.gain.value = 0.42;
  bus.connect(destination);

  const detune = 1 + (Math.random() * 0.008 - 0.004);
  const speeds = [0.015 + Math.random()*0.02, 0.02 + Math.random()*0.025, 0.008 + Math.random()*0.012];

  function layer(freq, baseGain, lfoSpeed, lfoDepth) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.value = baseGain;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = lfoSpeed;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = baseGain * lfoDepth;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);
    osc.connect(gain);
    gain.connect(bus);
    osc.start(); lfo.start();
    activeNodes.push(osc, lfo);
  }
  layer(rootFreq, 0.5, speeds[0], 0.4);
  layer(rootFreq * detune, 0.35, speeds[1], 0.45);
  layer(rootFreq * 2, 0.15, speeds[2], 0.6);
}

function startBellsVoice(ctx, destination, scale) {
  function playBell() {
    if (!isPlaying) return;
    const now = ctx.currentTime;
    const freq = pick(scale) * pick([1, 2]);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + randRange(4, 9));

    const panner = ctx.createStereoPanner();
    panner.pan.value = randRange(-0.6, 0.6);
    gain.connect(panner);
    panner.connect(destination);

    [1, 2.01, 3.99].forEach((mult, idx) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * mult;
      const partialGain = ctx.createGain();
      partialGain.gain.value = idx === 0 ? 1 : 0.25 / idx;
      osc.connect(partialGain);
      partialGain.connect(gain);
      osc.start(now);
      osc.stop(now + 10);
      activeNodes.push(osc);
    });

    scheduleTimeout(playBell, randRange(9000, 26000));
  }
  scheduleTimeout(playBell, randRange(500, 4000));
}

function startNatureVoice(ctx, destination) {
  const windSource = ctx.createBufferSource();
  windSource.buffer = createNoiseBuffer(ctx, 6);
  windSource.loop = true;
  const windFilter = ctx.createBiquadFilter();
  windFilter.type = 'lowpass';
  windFilter.frequency.value = 400;
  windFilter.Q.value = 0.6;
  const windGain = ctx.createGain();
  windGain.gain.value = 0.07;
  windSource.connect(windFilter); windFilter.connect(windGain); windGain.connect(destination);
  const windLfo = ctx.createOscillator();
  windLfo.frequency.value = 0.015 + Math.random() * 0.015;
  const windLfoGain = ctx.createGain();
  windLfoGain.gain.value = 220;
  windLfo.connect(windLfoGain); windLfoGain.connect(windFilter.frequency);
  windSource.start(); windLfo.start();
  activeNodes.push(windSource, windLfo);

  const oceanSource = ctx.createBufferSource();
  oceanSource.buffer = createNoiseBuffer(ctx, 8);
  oceanSource.loop = true;
  const oceanFilter = ctx.createBiquadFilter();
  oceanFilter.type = 'lowpass';
  oceanFilter.frequency.value = 180;
  const oceanGain = ctx.createGain();
  oceanGain.gain.value = 0.05;
  oceanSource.connect(oceanFilter); oceanFilter.connect(oceanGain); oceanGain.connect(destination);
  const oceanLfo = ctx.createOscillator();
  oceanLfo.frequency.value = 0.05 + Math.random() * 0.04;
  const oceanLfoGain = ctx.createGain();
  oceanLfoGain.gain.value = 0.045;
  oceanLfo.connect(oceanLfoGain); oceanLfoGain.connect(oceanGain.gain);
  oceanSource.start(); oceanLfo.start();
  activeNodes.push(oceanSource, oceanLfo);

  const rainBed = ctx.createBufferSource();
  rainBed.buffer = createNoiseBuffer(ctx, 5);
  rainBed.loop = true;
  const rainFilter = ctx.createBiquadFilter();
  rainFilter.type = 'highpass';
  rainFilter.frequency.value = 2500;
  const rainGain = ctx.createGain();
  rainGain.gain.value = 0.025;
  rainBed.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(destination);
  rainBed.start();
  activeNodes.push(rainBed);

  function playDroplet() {
    if (!isPlaying) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = randRange(1200, 3200);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.015, now);
    g.gain.exponentialRampToValueAtTime(0.0005, now + 0.15);
    osc.connect(g); g.connect(destination);
    osc.start(now); osc.stop(now + 0.2);
    activeNodes.push(osc);
    scheduleTimeout(playDroplet, randRange(120, 900));
  }
  scheduleTimeout(playDroplet, randRange(200, 1000));
}

function startDrumVoice(ctx, destination) {
  function playDrum() {
    if (!isPlaying) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.25);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.28, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(g); g.connect(destination);
    osc.start(now); osc.stop(now + 0.7);
    activeNodes.push(osc);

    if (Math.random() < 0.4) {
      scheduleTimeout(() => {
        if (!isPlaying) return;
        const t2 = ctx.currentTime;
        const noiseSrc = ctx.createBufferSource();
        noiseSrc.buffer = createNoiseBuffer(ctx, 1);
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 4000;
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.06, t2);
        g2.gain.exponentialRampToValueAtTime(0.0005, t2 + 0.12);
        noiseSrc.connect(hp); hp.connect(g2); g2.connect(destination);
        noiseSrc.start(t2); noiseSrc.stop(t2 + 0.15);
        activeNodes.push(noiseSrc);
      }, randRange(150, 350));
    }

    scheduleTimeout(playDrum, randRange(3000, 9000));
  }
  scheduleTimeout(playDrum, randRange(1000, 5000));
}

function startFluteVoice(ctx, destination, scale) {
  function playPhrase() {
    if (!isPlaying) return;
    const noteCount = Math.floor(randRange(2, 5));
    let delay = 0;
    for (let i = 0; i < noteCount; i++) {
      scheduleTimeout(() => {
        if (!isPlaying) return;
        const now = ctx.currentTime;
        const freq = pick(scale);
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;

        const vibrato = ctx.createOscillator();
        vibrato.frequency.value = 4.5;
        const vibratoGain = ctx.createGain();
        vibratoGain.gain.value = freq * 0.006;
        vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);

        const g = ctx.createGain();
        const dur = randRange(1.2, 2.6);
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.16, now + 0.25);
        g.gain.linearRampToValueAtTime(0, now + dur);
        osc.connect(g); g.connect(destination);
        osc.start(now); vibrato.start(now);
        osc.stop(now + dur + 0.1); vibrato.stop(now + dur + 0.1);
        activeNodes.push(osc, vibrato);
      }, delay);
      delay += randRange(1400, 2600);
    }
    scheduleTimeout(playPhrase, delay + randRange(15000, 40000));
  }
  scheduleTimeout(playPhrase, randRange(2000, 8000));
}

function startEngine() {
  stopEngine();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const scale = buildScale(selectedTheme.freq);

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;

  const shaper = audioCtx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) {
    const x = (i / 1023) * 2 - 1;
    curve[i] = Math.tanh(x * 1.3);
  }
  shaper.curve = curve;

  const convolver = audioCtx.createConvolver();
  convolver.buffer = createReverbImpulse(audioCtx, 3.5, 2.2);
  const reverbSend = audioCtx.createGain();
  reverbSend.gain.value = 0.35;
  const dryGain = audioCtx.createGain();
  dryGain.gain.value = 1;

  const mixBus = audioCtx.createGain();

  mixBus.connect(dryGain);
  mixBus.connect(reverbSend);
  reverbSend.connect(convolver);
  convolver.connect(shaper);
  dryGain.connect(shaper);
  shaper.connect(masterGain);
  masterGain.connect(audioCtx.destination);

  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(0.9, now + 3);

  masterBreathSpeed = 0.008 + Math.random() * 0.01;
  const breathLfo = audioCtx.createOscillator();
  breathLfo.frequency.value = masterBreathSpeed;
  const breathLfoGain = audioCtx.createGain();
  breathLfoGain.gain.value = 0.12;
  breathLfo.connect(breathLfoGain); breathLfoGain.connect(masterGain.gain);
  breathLfo.start();
  activeNodes.push(breathLfo);

  if (voiceState.drone) startDroneVoice(audioCtx, mixBus, selectedTheme.freq);
  if (voiceState.bells) startBellsVoice(audioCtx, mixBus, scale);
  if (voiceState.nature) startNatureVoice(audioCtx, mixBus);
  if (voiceState.drum) startDrumVoice(audioCtx, mixBus);
  if (voiceState.flute) startFluteVoice(audioCtx, mixBus, scale);

  isPlaying = true;
  startTime = Date.now();
  playBtn.textContent = '⏸ Arrêter';
  orbEl.classList.add('active');
  statusEl.textContent = 'Composition en cours — évolution continue, jamais identique.';
  startTimer();
  animateOrb();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `Durée d'écoute : ${h}:${m}:${s}`;
  }, 1000);
}

function animateOrb() {
  if (!isPlaying || !audioCtx) return;
  const t = audioCtx.currentTime;
  const scale = 1 + 0.15 * (0.5 + 0.5 * Math.sin(2 * Math.PI * masterBreathSpeed * t));
  orbEl.style.transform = `scale(${scale.toFixed(3)})`;
  orbAnimFrame = requestAnimationFrame(animateOrb);
}

function stopEngine() {
  isPlaying = false;
  if (orbAnimFrame) cancelAnimationFrame(orbAnimFrame);
  clearInterval(timerInterval);
  scheduledTimeouts.forEach(id => clearTimeout(id));
  scheduledTimeouts = [];

  if (audioCtx && masterGain) {
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0, now + 1.5);
    const ctxToClose = audioCtx;
    const nodesToStop = activeNodes;
    setTimeout(() => {
      nodesToStop.forEach(n => { try { n.stop(); } catch(e) {} });
      ctxToClose.close();
    }, 1600);
  }
  activeNodes = [];
  audioCtx = null;
  masterGain = null;

  playBtn.textContent = '▶ Lancer la composition';
  orbEl.classList.remove('active');
  orbEl.style.transform = 'scale(1)';
  statusEl.textContent = 'Choisis une fréquence et des voix, puis lance.';
  timerEl.textContent = '';
}

playBtn.addEventListener('click', () => {
  if (isPlaying) stopEngine();
  else startEngine();
});
</script>

</body>
</html>
