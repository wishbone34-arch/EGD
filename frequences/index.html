<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0612">
<link rel="icon" href="../icône-192.png">
<title>Fréquences Sacrées — Prototype</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #241a38 0%, #0a0612 70%);
    color: #e8ddf5;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 1.6rem;
    background: linear-gradient(90deg, #d4a5ff, #ffe9c7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    color: #a99bc4;
    font-size: 0.9rem;
    margin-bottom: 36px;
    text-align: center;
  }
  .theme-btn {
    width: 100%;
    max-width: 420px;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 14px;
    border: 1px solid rgba(212,165,255,0.3);
    background: rgba(124,77,255,0.08);
    color: #e8ddf5;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
  }
  .theme-btn.selected {
    background: rgba(124,77,255,0.28);
    border-color: #d4a5ff;
    font-weight: 700;
  }
  .theme-freq {
    display: block;
    font-size: 0.78rem;
    color: #b3a2d1;
    margin-top: 2px;
  }
  #playBtn {
    width: 100%;
    max-width: 420px;
    margin-top: 24px;
    padding: 20px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(90deg, #7c4dff, #d4a5ff);
    color: #16101f;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
  }
  #playBtn:active { transform: scale(0.98); }
  .status {
    margin-top: 18px;
    font-size: 0.85rem;
    color: #a99bc4;
    text-align: center;
    min-height: 20px;
  }
  .orb {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 18px auto 0;
    background: radial-gradient(circle at 35% 30%, #ffe9c7, #d4a5ff 45%, #7c4dff 75%, transparent 100%);
    opacity: 0.25;
    transition: opacity 0.6s ease;
  }
  .orb.active {
    opacity: 0.9;
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
</style>
</head>
<body>

<h1>Fréquences Sacrées</h1>
<div class="subtitle">Prototype — moteur procédural (jamais deux écoutes identiques)</div>

<div class="orb" id="orb"></div>

<div id="themeList" style="width:100%;max-width:420px;margin-top:24px;"></div>

<button id="playBtn">▶ Lancer la fréquence</button>
<div class="status" id="status">Choisis un thème, puis lance.</div>

<script>
const THEMES = [
  { id: 'naturel432', label: '432 Hz — Accordage naturel', freq: 432 },
  { id: 'solfeggio528', label: '528 Hz — Solfeggio ("de l\'amour")', freq: 528 },
  { id: 'egd396', label: '396 Hz — Résonance d\'Entité EGD (exemple)', freq: 396 }
];

let selectedTheme = THEMES[0];
let audioCtx = null;
let nodes = null;
let isPlaying = false;

const themeListEl = document.getElementById('themeList');
const playBtn = document.getElementById('playBtn');
const statusEl = document.getElementById('status');
const orbEl = document.getElementById('orb');

function renderThemes() {
  themeListEl.innerHTML = '';
  THEMES.forEach(theme => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (theme.id === selectedTheme.id ? ' selected' : '');
    btn.innerHTML = `${theme.label}<span class="theme-freq">${theme.freq} Hz</span>`;
    btn.onclick = () => {
      selectedTheme = theme;
      renderThemes();
      if (isPlaying) startEngine(theme);
    };
    themeListEl.appendChild(btn);
  });
}
renderThemes();

function startEngine(theme) {
  stopEngine();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.value = 0.35;

  const shaper = audioCtx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) {
    const x = (i / 1023) * 2 - 1;
    curve[i] = Math.tanh(x * 1.4);
  }
  shaper.curve = curve;

  const panner = audioCtx.createStereoPanner();

  master.connect(shaper);
  shaper.connect(panner);
  panner.connect(audioCtx.destination);

  const lfoSpeed1 = 0.015 + Math.random() * 0.02;
  const lfoSpeed2 = 0.02 + Math.random() * 0.025;
  const lfoSpeed3 = 0.008 + Math.random() * 0.012;
  const panSpeed = lfoSpeed1 * 0.3;
  const detune = 1 + (Math.random() * 0.008 - 0.004);

  const layers = [];

  function makeLayer(freq, baseGain, lfoSpeed, lfoDepth) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const gain = audioCtx.createGain();
    gain.gain.value = baseGain;

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = lfoSpeed;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = baseGain * lfoDepth;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);

    osc.connect(gain);
    gain.connect(master);

    osc.start();
    lfo.start();
    layers.push(osc, lfo);
  }

  makeLayer(theme.freq, 0.5, lfoSpeed1, 0.5);
  makeLayer(theme.freq * detune, 0.35, lfoSpeed2, 0.55);
  makeLayer(theme.freq * 2, 0.15, lfoSpeed3, 0.7);

  const panLfo = audioCtx.createOscillator();
  panLfo.frequency.value = panSpeed;
  const panLfoGain = audioCtx.createGain();
  panLfoGain.gain.value = 0.4;
  panLfo.connect(panLfoGain);
  panLfoGain.connect(panner.pan);
  panLfo.start();
  layers.push(panLfo);

  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.35, now + 2.5);

  nodes = { master, layers };
  isPlaying = true;
  playBtn.textContent = '⏸ Arrêter';
  orbEl.classList.add('active');
  statusEl.textContent = `${theme.label} — en cours (évolution unique)`;
}

function stopEngine() {
  if (nodes) {
    const now = audioCtx.currentTime;
    nodes.master.gain.linearRampToValueAtTime(0, now + 1.2);
    setTimeout(() => {
      nodes.layers.forEach(n => { try { n.stop(); } catch(e) {} });
      audioCtx.close();
    }, 1300);
    nodes = null;
  }
  isPlaying = false;
  playBtn.textContent = '▶ Lancer la fréquence';
  orbEl.classList.remove('active');
  statusEl.textContent = 'Choisis un thème, puis lance.';
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    stopEngine();
  } else {
    startEngine(selectedTheme);
  }
});
</script>

</body>
</html>
