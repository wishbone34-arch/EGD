<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fréquences Sacrées — Export MP3</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #241a38 0%, #0a0612 70%);
    color: #e8ddf5;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 1.4rem;
    background: linear-gradient(90deg, #d4a5ff, #ffe9c7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    color: #a99bc4;
    font-size: 0.85rem;
    margin-bottom: 24px;
    text-align: center;
  }
  .section-label {
    width: 100%;
    max-width: 420px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a7aa8;
    margin: 16px 0 8px;
  }
  .theme-btn {
    width: 100%;
    max-width: 420px;
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 12px;
    border: 1px solid rgba(212,165,255,0.3);
    background: rgba(124,77,255,0.08);
    color: #e8ddf5;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
  }
  .theme-btn.selected {
    background: rgba(124,77,255,0.28);
    border-color: #d4a5ff;
    font-weight: 700;
  }
  .voice-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    margin-bottom: 6px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(124,77,255,0.06);
    border: 1px solid rgba(212,165,255,0.18);
    font-size: 0.85rem;
  }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.15); border-radius: 999px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background: #7c4dff; }
  input:checked + .slider::before { transform: translateX(18px); }

  .duration-row {
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; margin-top: 6px;
    border-radius: 10px;
    background: rgba(124,77,255,0.06);
    border: 1px solid rgba(212,165,255,0.18);
  }
  .duration-row input {
    width: 70px; padding: 6px; border-radius: 8px; border: none;
    text-align: center; font-size: 0.95rem;
  }

  #genBtn {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
    padding: 18px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, #7c4dff, #d4a5ff);
    color: #16101f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  #genBtn:disabled { opacity: 0.5; }
  .status {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #a99bc4;
    text-align: center;
    min-height: 40px;
  }
  .progress-bar {
    width: 100%; max-width: 420px; height: 8px;
    background: rgba(255,255,255,0.1); border-radius: 999px;
    overflow: hidden; margin-top: 8px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7c4dff, #d4a5ff);
    transition: width 0.3s;
  }
  #downloadLink {
    display: none;
    width: 100%;
    max-width: 420px;
    margin-top: 16px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(80,220,150,0.15);
    border: 1px solid rgba(80,220,150,0.5);
    color: #a8f0cf;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>
<body>

<h1>Fréquences Sacrées</h1>
<div class="subtitle">Génère et télécharge tes compositions en MP3</div>

<div class="section-label">Fréquence de base</div>
<div id="themeList" style="width:100%;max-width:420px;"></div>

<div class="section-label">Voix</div>
<div id="voiceList" style="width:100%;max-width:420px;"></div>

<div class="section-label">Durée</div>
<div class="duration-row">
  <span>Durée (minutes)</span>
  <input type="number" id="durationInput" value="2" min="1" max="10" step="1">
</div>

<button id="genBtn">🎧 Générer le fichier MP3</button>
<div class="status" id="status">Prêt à générer.</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<a id="downloadLink" download="frequence-sacree.mp3">⬇️ Télécharger le MP3</a>

<script>
const THEMES = [
  { id: 'naturel432', label: '432 Hz — Accordage naturel', freq: 432 },
  { id: 'solfeggio528', label: '528 Hz — Solfeggio ("de l\'amour")', freq: 528 },
  { id: 'egd396', label: '396 Hz — Résonance d\'Entité EGD (exemple)', freq: 396 }
];
const VOICES = [
  { id: 'drone', label: '🌫️ Nappes éthérées', default: true },
  { id: 'bells', label: '🔔 Bols chantants', default: true },
  { id: 'nature', label: '🌧️ Nature', default: false },
  { id: 'drum', label: '🥁 Percussions', default: false },
  { id: 'flute', label: '🎋 Flûte méditative', default: false }
];

let selectedTheme = THEMES[0];
const voiceState = {};
VOICES.forEach(v => voiceState[v.id] = v.default);

const themeListEl = document.getElementById('themeList');
const voiceListEl = document.getElementById('voiceList');
const genBtn = document.getElementById('genBtn');
const statusEl = document.getElementById('status');
const progressFill = document.getElementById('progressFill');
const downloadLink = document.getElementById('downloadLink');
const durationInput = document.getElementById('durationInput');

function renderThemes() {
  themeListEl.innerHTML = '';
  THEMES.forEach(theme => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (theme.id === selectedTheme.id ? ' selected' : '');
    btn.textContent = theme.label;
    btn.onclick = () => { selectedTheme = theme; renderThemes(); };
    themeListEl.appendChild(btn);
  });
}
renderThemes();

function renderVoices() {
  voiceListEl.innerHTML = '';
  VOICES.forEach(v => {
    const row = document.createElement('div');
    row.className = 'voice-row';
    row.innerHTML = `
      <span>${v.label}</span>
      <label class="switch">
        <input type="checkbox" data-voice="${v.id}" ${voiceState[v.id] ? 'checked' : ''}>
        <span class="slider"></span>
      </label>`;
    voiceListEl.appendChild(row);
  });
  voiceListEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => { voiceState[cb.dataset.voice] = cb.checked; });
  });
}
renderVoices();

// ===== Utilitaires =====
function randRange(min, max) { return min + Math.random() * (max - min); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function createNoiseBuffer(ctx, seconds) {
  const bufferSize = Math.floor(ctx.sampleRate * seconds);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + 0.02 * white) / 1.02;
    data[i] = lastOut * 3.2;
  }
  return buffer;
}

function createReverbImpulse(ctx, duration, decay) {
  const rate = ctx.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

function buildScale(rootFreq) {
  const ratios = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2];
  return ratios.map(r => rootFreq * r);
}

// ===== Construction de la timeline d'événements (avant rendu, pas de setTimeout) =====
function buildTimeline(duration) {
  const events = [];
  if (voiceState.bells) {
    let t = randRange(0.5, 4);
    while (t < duration) {
      events.push({ type: 'bell', time: t });
      t += randRange(9, 26);
    }
  }
  if (voiceState.drum) {
    let t = randRange(1, 5);
    while (t < duration) {
      events.push({ type: 'drum', time: t });
      if (Math.random() < 0.4) events.push({ type: 'shaker', time: t + randRange(0.15, 0.35) });
      t += randRange(3, 9);
    }
  }
  if (voiceState.nature) {
    let t = randRange(0.2, 1);
    while (t < duration) {
      events.push({ type: 'droplet', time: t });
      t += randRange(0.12, 0.9);
    }
  }
  if (voiceState.flute) {
    let t = randRange(2, 8);
    while (t < duration) {
      const noteCount = Math.floor(randRange(2, 5));
      for (let i = 0; i < noteCount; i++) {
        const noteTime = t + i * randRange(1.4, 2.6);
        if (noteTime < duration) events.push({ type: 'flute', time: noteTime });
      }
      t += noteCount * 2 + randRange(15, 40);
    }
  }
  return events;
}

// ===== Rendu hors-ligne =====
async function renderOffline(duration) {
  const sampleRate = 44100;
  const ctx = new OfflineAudioContext(2, Math.floor(sampleRate * duration), sampleRate);
  const scale = buildScale(selectedTheme.freq);
  const rootFreq = selectedTheme.freq;

  const masterGain = ctx.createGain();
  masterGain.gain.value = 0;

  const shaper = ctx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) {
    const x = (i / 1023) * 2 - 1;
    curve[i] = Math.tanh(x * 1.3);
  }
  shaper.curve = curve;

  const convolver = ctx.createConvolver();
  convolver.buffer = createReverbImpulse(ctx, 3.5, 2.2);
  const reverbSend = ctx.createGain();
  reverbSend.gain.value = 0.35;
  const dryGain = ctx.createGain();
  dryGain.gain.value = 1;
  const mixBus = ctx.createGain();

  mixBus.connect(dryGain);
  mixBus.connect(reverbSend);
  reverbSend.connect(convolver);
  convolver.connect(shaper);
  dryGain.connect(shaper);
  shaper.connect(masterGain);
  masterGain.connect(ctx.destination);

  masterGain.gain.setValueAtTime(0, 0);
  masterGain.gain.linearRampToValueAtTime(0.9, Math.min(3, duration * 0.3));
  masterGain.gain.setValueAtTime(0.9, Math.max(0, duration - 3));
  masterGain.gain.linearRampToValueAtTime(0, duration);

  const breathSpeed = 0.008 + Math.random() * 0.01;
  const breathLfo = ctx.createOscillator();
  breathLfo.frequency.value = breathSpeed;
  const breathLfoGain = ctx.createGain();
  breathLfoGain.gain.value = 0.12;
  breathLfo.connect(breathLfoGain); breathLfoGain.connect(masterGain.gain);
  breathLfo.start(0); breathLfo.stop(duration);

  // Nappes éthérées (continu)
  if (voiceState.drone) {
    const bus = ctx.createGain();
    bus.gain.value = 0.42;
    bus.connect(mixBus);
    const detune = 1 + (Math.random() * 0.008 - 0.004);
    const speeds = [0.015 + Math.random()*0.02, 0.02 + Math.random()*0.025, 0.008 + Math.random()*0.012];
    function layer(freq, baseGain, lfoSpeed, lfoDepth) {
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const gain = ctx.createGain(); gain.gain.value = baseGain;
      const lfo = ctx.createOscillator(); lfo.frequency.value = lfoSpeed;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = baseGain * lfoDepth;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      osc.connect(gain); gain.connect(bus);
      osc.start(0); osc.stop(duration);
      lfo.start(0); lfo.stop(duration);
    }
    layer(rootFreq, 0.5, speeds[0], 0.4);
    layer(rootFreq * detune, 0.35, speeds[1], 0.45);
    layer(rootFreq * 2, 0.15, speeds[2], 0.6);
  }

  // Nature — lits continus (vent + océan + pluie de fond)
  if (voiceState.nature) {
    const windSource = ctx.createBufferSource();
    windSource.buffer = createNoiseBuffer(ctx, Math.min(duration, 6));
    windSource.loop = true;
    const windFilter = ctx.createBiquadFilter();
    windFilter.type = 'lowpass'; windFilter.frequency.value = 400; windFilter.Q.value = 0.6;
    const windGain = ctx.createGain(); windGain.gain.value = 0.07;
    windSource.connect(windFilter); windFilter.connect(windGain); windGain.connect(mixBus);
    const windLfo = ctx.createOscillator();
    windLfo.frequency.value = 0.015 + Math.random() * 0.015;
    const windLfoGain = ctx.createGain(); windLfoGain.gain.value = 220;
    windLfo.connect(windLfoGain); windLfoGain.connect(windFilter.frequency);
    windSource.start(0); windSource.stop(duration);
    windLfo.start(0); windLfo.stop(duration);

    const oceanSource = ctx.createBufferSource();
    oceanSource.buffer = createNoiseBuffer(ctx, Math.min(duration, 8));
    oceanSource.loop = true;
    const oceanFilter = ctx.createBiquadFilter();
    oceanFilter.type = 'lowpass'; oceanFilter.frequency.value = 180;
    const oceanGain = ctx.createGain(); oceanGain.gain.value = 0.05;
    oceanSource.connect(oceanFilter); oceanFilter.connect(oceanGain); oceanGain.connect(mixBus);
    const oceanLfo = ctx.createOscillator();
    oceanLfo.frequency.value = 0.05 + Math.random() * 0.04;
    const oceanLfoGain = ctx.createGain(); oceanLfoGain.gain.value = 0.045;
    oceanLfo.connect(oceanLfoGain); oceanLfoGain.connect(oceanGain.gain);
    oceanSource.start(0); oceanSource.stop(duration);
    oceanLfo.start(0); oceanLfo.stop(duration);

    const rainBed = ctx.createBufferSource();
    rainBed.buffer = createNoiseBuffer(ctx, Math.min(duration, 5));
    rainBed.loop = true;
    const rainFilter = ctx.createBiquadFilter();
    rainFilter.type = 'highpass'; rainFilter.frequency.value = 2500;
    const rainGain = ctx.createGain(); rainGain.gain.value = 0.025;
    rainBed.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(mixBus);
    rainBed.start(0); rainBed.stop(duration);
  }

  // Événements ponctuels (bols, percussions, flûte, gouttes)
  const timeline = buildTimeline(duration);
  timeline.forEach(ev => {
    if (ev.type === 'bell') {
      const freq = pick(scale) * pick([1, 2]);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, ev.time);
      gain.gain.linearRampToValueAtTime(0.22, ev.time + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ev.time + randRange(4, 9));
      const panner = ctx.createStereoPanner();
      panner.pan.value = randRange(-0.6, 0.6);
      gain.connect(panner); panner.connect(mixBus);
      [1, 2.01, 3.99].forEach((mult, idx) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = freq * mult;
        const partialGain = ctx.createGain();
        partialGain.gain.value = idx === 0 ? 1 : 0.25 / idx;
        osc.connect(partialGain); partialGain.connect(gain);
        osc.start(ev.time); osc.stop(Math.min(duration, ev.time + 10));
      });
    } else if (ev.type === 'drum') {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, ev.time);
      osc.frequency.exponentialRampToValueAtTime(55, ev.time + 0.25);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, ev.time);
      g.gain.linearRampToValueAtTime(0.28, ev.time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ev.time + 0.6);
      osc.connect(g); g.connect(mixBus);
      osc.start(ev.time); osc.stop(Math.min(duration, ev.time + 0.7));
    } else if (ev.type === 'shaker') {
      const noiseSrc = ctx.createBufferSource();
      noiseSrc.buffer = createNoiseBuffer(ctx, 1);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 4000;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.06, ev.time);
      g2.gain.exponentialRampToValueAtTime(0.0005, ev.time + 0.12);
      noiseSrc.connect(hp); hp.connect(g2); g2.connect(mixBus);
      noiseSrc.start(ev.time); noiseSrc.stop(Math.min(duration, ev.time + 0.15));
    } else if (ev.type === 'droplet') {
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = randRange(1200, 3200);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.015, ev.time);
      g.gain.exponentialRampToValueAtTime(0.0005, ev.time + 0.15);
      osc.connect(g); g.connect(mixBus);
      osc.start(ev.time); osc.stop(Math.min(duration, ev.time + 0.2));
    } else if (ev.type === 'flute') {
      const freq = pick(scale);
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const vibrato = ctx.createOscillator();
      vibrato.frequency.value = 4.5;
      const vibratoGain = ctx.createGain();
      vibratoGain.gain.value = freq * 0.006;
      vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);
      const g = ctx.createGain();
      const dur = randRange(1.2, 2.6);
      g.gain.setValueAtTime(0, ev.time);
      g.gain.linearRampToValueAtTime(0.16, ev.time + 0.25);
      g.gain.linearRampToValueAtTime(0, Math.min(duration, ev.time + dur));
      osc.connect(g); g.connect(mixBus);
      const stopTime = Math.min(duration, ev.time + dur + 0.1);
      osc.start(ev.time); osc.stop(stopTime);
      vibrato.start(ev.time); vibrato.stop(stopTime);
    }
  });

  return await ctx.startRendering();
}

// ===== Encodage MP3 =====
function floatTo16BitPCM(input) {
  const output = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return output;
}

function encodeMp3(audioBuffer) {
  const sampleRate = audioBuffer.sampleRate;
  const left = floatTo16BitPCM(audioBuffer.getChannelData(0));
  const right = audioBuffer.numberOfChannels > 1 ? floatTo16BitPCM(audioBuffer.getChannelData(1)) : left;

  const mp3encoder = new lamejs.Mp3Encoder(2, sampleRate, 128);
  const blockSize = 1152;
  const mp3Data = [];

  for (let i = 0; i < left.length; i += blockSize) {
    const leftChunk = left.subarray(i, i + blockSize);
    const rightChunk = right.subarray(i, i + blockSize);
    const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
    if (mp3buf.length > 0) mp3Data.push(mp3buf);

    if (i % (blockSize * 200) === 0) {
      const pct = 50 + Math.floor((i / left.length) * 50);
      progressFill.style.width = pct + '%';
    }
  }
  const endBuf = mp3encoder.flush();
  if (endBuf.length > 0) mp3Data.push(endBuf);

  return new Blob(mp3Data, { type: 'audio/mp3' });
}

// ===== Orchestration =====
genBtn.addEventListener('click', async () => {
  genBtn.disabled = true;
  downloadLink.style.display = 'none';
  progressFill.style.width = '2%';
  const duration = Math.max(1, parseInt(durationInput.value, 10) || 2) * 60;

  try {
    statusEl.textContent = 'Génération de la composition...';
    const audioBuffer = await renderOffline(duration);
    progressFill.style.width = '50%';

    statusEl.textContent = 'Encodage en MP3...';
    await new Promise(r => setTimeout(r, 30)); // laisse l'UI se rafraîchir
    const blob = encodeMp3(audioBuffer);
    progressFill.style.width = '100%';

    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    const sizeMo = (blob.size / (1024*1024)).toFixed(1);
    downloadLink.textContent = `⬇️ Télécharger le MP3 (${sizeMo} Mo)`;
    downloadLink.style.display = 'block';
    statusEl.textContent = 'Terminé ! Le fichier est prêt à être téléchargé.';
  } catch (err) {
    statusEl.textContent = 'Erreur : ' + err.message;
    console.error(err);
  } finally {
    genBtn.disabled = false;
  }
});
</script>

</body>
</html>
